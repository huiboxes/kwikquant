# =============================================================================
# KwikQuant CI — fast feedback for every push and pull request.
#
# Single JDK (21 LTS), single OS (ubuntu-latest). The ubuntu-latest runner ships
# with a working Docker daemon, so the same `verify` run that does compile /
# unit tests / ArchUnit / jacoco also drives the Testcontainers integration
# tests against real Postgres. The contract-drift job reuses the OpenAPI spec
# produced by that run to gate the generated REST types (frontend, cli) and the
# generated docs artifacts against drift. The python-tests job gates
# tests/python (pytest half of the matching-fixtures dual gate plus worker
# contract tests) with no Docker and no secrets.
#
# Note on PR safety: this workflow runs on `pull_request` (not
# `pull_request_target`) and intentionally requests no `secrets`. Test-time
# JWT/API-key material lives in application-test.yml as non-secret 32-byte
# placeholders, never real credentials. Before adding any token (Codecov,
# SonarCloud, Sonatype, ...) split secret-aware steps into a separate workflow
# gated by repo-owner approval — fork PRs can otherwise modify mvnw / build
# scripts to exfiltrate the secret.
# =============================================================================

name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read
    actions: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    MAVEN_CLI_OPTS: "-B -ntp -Dstyle.color=always"
    JAVA_VERSION: "21"

jobs:
    build:
        name: Backend Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Verify wrapper integrity
              run: |
                  test -x ./mvnw
                  ./mvnw --version

            - name: Verify Docker is available (Testcontainers prerequisite)
              run: docker info --format 'Docker {{.ServerVersion}} ({{.OperatingSystem}})'

            - name: Verify (compile + unit + integration + jacoco + archunit)
              timeout-minutes: 10
              run: ./mvnw $MAVEN_CLI_OPTS clean verify

            # OpenApiSpecTest (part of verify) dumps /v3/api-docs here; the
            # contract-drift job consumes it without booting the backend again.
            - name: Upload OpenAPI spec for contract-drift
              uses: actions/upload-artifact@v7
              with:
                  name: openapi-spec
                  path: target/api-spec.json
                  if-no-files-found: error

            - name: Upload JaCoCo reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: jacoco-reports
                  path: "**/target/site/jacoco/"
                  if-no-files-found: ignore

            - name: Upload test reports on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: |
                      **/target/surefire-reports/
                      **/target/failsafe-reports/
                  if-no-files-found: ignore

    python-tests:
        name: Python Tests (worker / SDK)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: requirements-worker.txt

            - name: Install worker requirements
              run: python -m pip install -r requirements-worker.txt

            # pyproject.toml pins testpaths=tests/python; this is the pytest
            # half of the matching-fixtures dual gate (docs/matching-spec.md).
            - name: Run pytest
              timeout-minutes: 5
              run: python -m pytest

    contract-drift:
        name: Contract Drift (frontend / cli / docs)
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Download OpenAPI spec from build job
              uses: actions/download-artifact@v7
              with:
                  name: openapi-spec
                  path: target

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.12.0'
                  cache: pnpm
                  cache-dependency-path: |
                      frontend/pnpm-lock.yaml
                      cli/pnpm-lock.yaml

            - name: Check frontend REST types drift
              working-directory: frontend
              run: |
                  pnpm install --frozen-lockfile
                  KWIKQUANT_API_DOCS=../target/api-spec.json pnpm gen:api:check

            - name: Check CLI REST types drift
              working-directory: cli
              run: |
                  pnpm install --frozen-lockfile
                  KWIKQUANT_API_DOCS=../target/api-spec.json pnpm gen:types:check

            # api-reference first: llms-full merges it, so the second check
            # must see the freshly regenerated file.
            - name: Check docs artifacts drift
              working-directory: frontend
              run: |
                  KWIKQUANT_API_DOCS=../target/api-spec.json pnpm gen:api:reference:check
                  pnpm gen:llms-full:check
