# =============================================================================
# KwikQuant 镜像发布 — 打 tag 发版。
#
# 触发:push tag v*(如 v0.1.0)。构建 app/worker/frontend 三镜像,push GHCR。
# 镜像 tag = git tag 名(:v0.1.0) + :latest(滚动)。用默认 GITHUB_TOKEN(packages:write 自带)。
#
# 流程约束:打 tag 前确保 main 分支 ci.yml 测试绿(本 workflow 只 build 不跑测试,
# Dockerfile 内 mvn package -DskipTests;测试由 push main / PR 的 ci.yml 守)。
# =============================================================================

name: Docker Publish

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        name: Build & Push ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: app
                      context: .
                      file: docker/Dockerfile
                      image: ghcr.io/huiboxes/kwikquant
                    - name: worker
                      context: .
                      file: docker/kwikquant-worker.Dockerfile
                      image: ghcr.io/huiboxes/kwikquant-worker
                    - name: frontend
                      context: frontend
                      file: frontend/Dockerfile
                      image: ghcr.io/huiboxes/kwikquant-frontend
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ matrix.image }}
                  tags: |
                      type=ref,event=tag
                      type=raw,value=latest

            - name: Build & push
              uses: docker/build-push-action@v5
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
