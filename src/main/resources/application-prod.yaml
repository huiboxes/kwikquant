# 生产环境 profile 配置(硅谷服务器,OKX 直连,无需 CCXT 代理)。
# 激活:docker-compose.prod.yml 的 app 服务 environment 设 SPRING_PROFILES_ACTIVE=prod。
# secrets(JWT_SECRET/ENCRYPTION_KEY/KWIKQUANT_MCP_PEPPER/POSTGRES_*)仍走 env_file 注入,不在此硬编码。
# 代理:application.yaml 不写 kwikquant.proxy.defaults → ProxyProperties.resolve 返回直连(硅谷 OKX 可达)。
spring:
  flyway:
    # prod 永不 baseline:迁移必须全量可追溯(application.yaml 已 false,此处显式重申防回退)
    baseline-on-migrate: false

kwikquant:
  worker:
    # runner worker 容器(DockerWorkerManager 按需 docker run --network kwikquant-worker-net)访问同网络 app 容器
    # container_name=kwikquant-app(docker-compose.prod.yml);对齐 worker_server.py DEFAULT_API_BASE
    api-base-url: http://kwikquant-app:8080
    # worker 镜像走 GHCR(CI push :tag+:latest);env KWIKQUANT_WORKER_IMAGE 覆盖让 deploy 脚本锁 tag
    # (防 app:$TAG 与 worker:latest 错版,回滚时 worker 也跟 PREV_TAG 回滚)
    image: ${KWIKQUANT_WORKER_IMAGE:ghcr.io/huiboxes/kwikquant-worker:latest}
    # 回测子进程(PythonSubprocessBacktestRunner):python venv + worker 源码内置于 app 镜像
    # (docker/Dockerfile),子进程在 app 容器内执行,REST 回环 127.0.0.1:8080。
    # env KWIKQUANT_WORKER_PYTHON/SCRIPT/API_BASE 可覆盖(挂载自定义解释器场景)。
    python-command: ${KWIKQUANT_WORKER_PYTHON:/opt/venv/bin/python}
    script: ${KWIKQUANT_WORKER_SCRIPT:kwikquant_worker/worker_server.py}
    api-base: ${KWIKQUANT_WORKER_API_BASE:http://127.0.0.1:8080}
  cookie:
    # prod HTTPS(服务器 nginx 已终结 TLS,Set-Cookie 经反代转发,Secure cookie 浏览器正常发回)
    secure: true
  mcp:
    # McpTokenHasher(@Component)启动必需:缺此属性 prod 启动即失败。值经 env_file 注入(.env 模板已列)
    pepper: ${KWIKQUANT_MCP_PEPPER}
logging:
  level:
    com.kwikquant: INFO
    org.springframework.web: WARN
