spring:
  application:
    name: kwikquant
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: kwikquant-hikari
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 300000
      keepalive-time: 120000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
    default-property-inclusion: non_null
  ai:
    mcp:
      server:
        name: kwikquant
        version: "1.0"
        protocol: STREAMABLE

mybatis:
  type-handlers-package: com.kwikquant.market.infrastructure
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-statement-timeout: 5

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # /api/v1/ai/chat body 放开:souceCode 1MB + messages 100 条×100K char 最坏 ~10MB
    # max-swallow-size 兜底 application/json 大 body(非 form),防 413 截断
    max-http-form-post-size: 11MB
    max-swallow-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

kwikquant:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  encryption:
    key: ${ENCRYPTION_KEY}
  audit:
    async: true
    async-pool:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 1000
      keep-alive: 60s
  portfolio:
    snapshot-interval-ms: 300000            # 权益曲线定时快照(R3),5min 采集一次写入 equity_snapshots
  lease:
    node-id: ${KWIKQUANT_LEASE_NODE_ID:}    # 单节点 lease 节点 ID;缺省 fallback 随机 UUID(k8s 可设 pod name)
    stale-ms: 90000                          # lease 过期阈值(heartbeat 30s × 3 未更新判实例崩溃,新实例接管)
  # CCXT 代理配置已移至 application-dev.yaml(dev 本地翻墙 127.0.0.1:13659)。
  # application.yaml 不写 kwikquant.proxy.defaults → ProxyProperties.resolve 返回直连(prod 硅谷 OKX 可达)。
  backtest:
    # 执行器:subprocess = app 内子进程(dev/test 受信环境,缺省) / docker = 隔离容器(prod 必须,
    # application-prod.yaml 覆盖)。子进程与 app 同 UID,/proc 可读平台密钥,严禁用于不可信用户输入环境。
    runner: subprocess
    max-concurrent-per-user: 2               # per-user PENDING+RUNNING 配额,超限 429(7306)
    max-bars: 100000                         # 单次回测 bar 数上限(interval 折算,防超长区间 DoS)
    container-memory: 2g                     # docker runner 容器内存(与 worker RLIMIT_AS 默认对齐)
    container-cpus: 1
    stale-grace-sec: 300                     # 租约宽限:RUNNING 超 timeout+宽限无进度更新判失联
    stale-check-interval-ms: 300000          # 失联回收扫描周期
  market:
    stale-threshold: 5s
    idle-timeout: 30s
    exchanges:
      - name: OKX
        market-types:
          - SPOT
          - PERP
        persistent-symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
      - name: BITGET
        market-types: [SPOT, PERP]
        persistent-symbols: []
      - name: BINANCE
        market-types:
          - SPOT
          - PERP
        persistent-symbols: []
  quote:                                    # Quote 币种配置(USDT-only 默认,预留扩展;改 yaml 即可加 USDC)
    allowed-currencies: [USDT]
    paper-initial-balance: 100000
  ai:                                        # AI 配置(上下文窗口预算 + 各 provider 默认模型)
    context-window:
      default-tokens: 32000                  # 模型未命中 by-model 时的窗口大小(保守上限)
      by-model:                               # 模型名 contains key → 该窗口大小
        gpt-4o: 128000
        claude: 200000
    default-model:                            # 各 provider 默认模型(替代 adapter 硬编码);COMPATIBLE 不配→null→报 model required
      OPENAI: gpt-4o
      ANTHROPIC: claude-sonnet-4-20250514
