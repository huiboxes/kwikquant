spring:
  application:
    name: kwikquant
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: kwikquant-hikari
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 300000
      keepalive-time: 120000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
    default-property-inclusion: non_null
  ai:
    mcp:
      server:
        name: kwikquant
        version: "1.0"
        protocol: STREAMABLE

mybatis:
  type-handlers-package: com.kwikquant.market.infrastructure
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-statement-timeout: 5

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # /api/v1/ai/chat body 放开:souceCode 1MB + messages 100 条×100K char 最坏 ~10MB
    # max-swallow-size 兜底 application/json 大 body(非 form),防 413 截断
    max-http-form-post-size: 11MB
    max-swallow-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

kwikquant:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  encryption:
    key: ${ENCRYPTION_KEY}
  audit:
    async: true
    async-pool:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 1000
      keep-alive: 60s
  portfolio:
    snapshot-interval-ms: 300000            # 权益曲线定时快照(R3),5min 采集一次写入 equity_snapshots
  # CCXT 代理配置已移至 application-dev.yaml(dev 本地翻墙 127.0.0.1:13659)。
  # application.yaml 不写 kwikquant.proxy.defaults → ProxyProperties.resolve 返回直连(prod 硅谷 OKX 可达)。
  market:
    stale-threshold: 5s
    idle-timeout: 30s
    exchanges:
      - name: OKX
        market-types:
          - SPOT
          - PERP
        persistent-symbols: [BTC/USDT, ETH/USDT, SOL/USDT]
      - name: BITGET
        market-types: [SPOT, PERP]
        persistent-symbols: []
      - name: BINANCE
        market-types:
          - SPOT
          - PERP
        persistent-symbols: []
  quote:                                    # Quote 币种配置(USDT-only 默认,预留扩展;改 yaml 即可加 USDC)
    allowed-currencies: [USDT]
    paper-initial-balance: 100000
