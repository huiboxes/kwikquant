# 本地开发 profile 配置。JWT / 加密 secret 必须走环境变量，避免源码泄露即被接管。
# 本地启动时通过 .env 或 export 提供：
#   JWT_SECRET             32 字节 base64（openssl rand -base64 32）
#   ENCRYPTION_KEY         32 字节 base64（openssl rand -base64 32）
#   KWIKQUANT_MCP_PEPPER   MCP PAT HMAC pepper（任意高熵字符串，建议 ≥ 32 字节）
# 若未设置 → 应用启动时 KeyManagementService / McpTokenHasher 会失败退出，符合 fail-fast。
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kwikquant}
    username: ${POSTGRES_USER:kwikquant}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    baseline-on-migrate: true

kwikquant:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${ENCRYPTION_KEY}
  mcp:
    pepper: ${KWIKQUANT_MCP_PEPPER}
  cookie:
    # dev 跑 HTTP,Secure cookie 浏览器不发 → 刷新页面 refresh 拿不到 cookie 退出登录;故 dev 关 Secure
    secure: false
  # SSRF 出站豁免(self-host/dev):放行本地 LLM 网关(Ollama/vLLM/LiteLLM 等 http+回环地址)。
  # prod 不得配置(默认全禁 HTTPS+公网),见 OutboundPolicyConfigurer。
  outbound:
    allow-private-hosts: localhost,127.0.0.1,::1
  # WS 握手 Origin 白名单:Spring 默认仅同源(Origin 对 Host)放行,dev 页面源(vite 5173)≠
  # 后端 Host(8080),跨源握手被拒 403,故放行本机开发源。prod 同源部署走默认同源判定,
  # 不配置本项;不得放宽为 *(Origin 校验是防跨站携 cookie 握手的防线)。
  # 注意用逗号分隔标量(WebSocketConfig @Value List 注入不支持 YAML 序列)。
  ws:
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
  # 本地默认直连交易所。需要代理时通过 kwikquant.proxy.defaults 显式配置，避免依赖特定开发者端口。
  # 回测执行器:dev 也走 docker(每任务一个隔离容器,镜像自带 python3.11,不依赖宿主 python 版本)。
  # 宿主系统 python3 常低于 3.11(mac 自带 3.9),subprocess 模式的自动搭建会失败;docker runner
  # 复用本地 kwikquant-worker:latest 镜像,与 prod 同路径,避免 dev/prod 行为分叉。
  backtest:
    runner: docker
  worker:
    # 回测/实盘 worker 容器镜像:本地构建(docker build -f docker/kwikquant-worker.Dockerfile),
    # 镜像自带 python3.11 + 依赖,不依赖宿主系统 python。镜像缺失时 docker pull 或本地构建。
    image: ${KWIKQUANT_WORKER_IMAGE:kwikquant-worker:latest}
    # worker 容器连本机 app(mac host.docker.internal;prod 用 kwikquant-app 容器名);
    # WorkerOrchestratorService 传 KWIKQUANT_API_BASE env,_run_runner 推导 ws_url=ws://<api-base>/ws;
    # DockerBacktestRunner 同样用此值让回测容器回连 app 拉 K 线。
    api-base-url: http://host.docker.internal:8080
