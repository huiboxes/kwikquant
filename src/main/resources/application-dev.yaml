# 本地开发 profile 配置。JWT / 加密 secret 必须走环境变量，避免源码泄露即被接管。
# 本地启动时通过 .env 或 export 提供：
#   JWT_SECRET             32 字节 base64（openssl rand -base64 32）
#   ENCRYPTION_KEY         32 字节 base64（openssl rand -base64 32）
#   KWIKQUANT_MCP_PEPPER   MCP PAT HMAC pepper（任意高熵字符串，建议 ≥ 32 字节）
# 若未设置 → 应用启动时 KeyManagementService / McpTokenHasher 会失败退出，符合 fail-fast。
kwikquant:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${ENCRYPTION_KEY}
  mcp:
    pepper: ${KWIKQUANT_MCP_PEPPER}
  cookie:
    # dev 跑 HTTP,Secure cookie 浏览器不发 → 刷新页面 refresh 拿不到 cookie 退出登录;故 dev 关 Secure
    secure: false
  # CCXT 代理配置(dev 本地翻墙 127.0.0.1:13659;prod 硅谷直连,application.yaml 不写 defaults → ProxyProperties.resolve 返直连)
  proxy:
    defaults:
      rest-proxy: http://127.0.0.1:13659
      ws-proxy: socks5://127.0.0.1:13659
  worker:
    # 回测子进程 Python 解释器;dev 用项目根 venv(brew python@3.12 + requirements-worker.txt,
    # 系统 python3 仅 3.9 不满足 pyproject >=3.11,且 externally-managed 不宜直装)。换机器 export
    # KWIKQUANT_WORKER_PYTHON=/path/to/python 覆盖,或重建:.venv-worker/bin/pip install -r requirements-worker.txt
    python-command: ${KWIKQUANT_WORKER_PYTHON:/Users/huibox/codeSpace/2026/kwikquant/.venv-worker/bin/python}
    # 回测 worker 调 Java REST 拉 K 线(Task 6 废 PG 直连);dev Java 在本机 8080
    api-base: http://localhost:8080
    # runner worker 容器连本地 app(mac host.docker.internal;prod 用 kwikquant-app 容器名);
    # WorkerOrchestratorService 传 KWIKQUANT_API_BASE env,_run_runner 推导 ws_url=ws://<api-base>/ws
    api-base-url: http://host.docker.internal:8080
    # 回测 worker 直连 Postgres 只读 DSN(加载 K 线);dev 复用主 datasource 同库同账号
    pg-readonly-dsn: host=${POSTGRES_HOST:127.0.0.1} port=${POSTGRES_PORT:5432} dbname=${POSTGRES_DB:kwikquant} user=${POSTGRES_USER:kwikquant} password=${POSTGRES_PASSWORD:}
