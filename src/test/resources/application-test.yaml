spring:
  flyway:
    enabled: true

kwikquant:
  lease:
    # 同一测试 JVM 内多个 Spring context（不同 @TestPropertySource/webEnvironment 组合）共享同一库。
    # 固定 node-id 让后续 context 的 acquire 命中 "node_id = self" 分支，避免被首个 context 的
    # lease 拒绝启动（ActiveLeaseHeldException）。生产语义不受影响：单 JVM 本就是一个部署单元。
    node-id: integration-test-node
  jwt:
    secret: 2OqIn7uJu4pahdZXkEQSpnmO6sIudTxd+TrlfIj5eG4=
  encryption:
    key: eBHJ6Tn1uUu1VnkTg3m6O4uP9UXZBeGFR4zd2gKE6WQ=
  mcp:
    pepper: dGhpcy1pcy1hLW1jcC10b2tlbi1wZXBwZXItdGVzdC1zZWNyZXQ=
  cookie:
    secure: false
  worker:
    python-command: python3
    script: kwikquant_worker/worker_server.py
    api-base: http://localhost:8080
    api-base-url: http://localhost:8080
  market:
    exchanges:
      - name: OKX
        market-types: [SPOT]
        persistent-symbols: []
      - name: BITGET
        market-types: [SPOT]
        persistent-symbols: []
      - name: BINANCE
        market-types: [SPOT]
        persistent-symbols: []
