# edge 容器 nginx.conf(无面板用户:CF Full strict → :443 TLS 终结 → frontend 容器)
#
# 用法:docker compose --profile edge up
# 前置:Cloudflare 面板 SSL/TLS → Origin Server → Generate Certificate,签 Origin Certificate
#       (15 年免费,只 CF 信任)。证书存服务器,export TLS_CERT_DIR=<证书目录> 后 up。
# compose 挂卷:./edge/nginx.conf → 容器 /etc/nginx/conf.d/default.conf
#              $TLS_CERT_DIR → 容器 /cert(fullchain.pem + privkey.pem)
# 有面板用户(宝塔/1Panel)不起 edge,用面板 nginx 做 TLS + 反代 frontend:8081(见 docs/deploy.md)。
server {
    listen 443 ssl http2;
    server_name kwikquant.example.com;   # 改你的域名

    ssl_certificate /cert/fullchain.pem;
    ssl_certificate_key /cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # → frontend 容器(同 kwikquant-worker-net,容器名:容器端口 80,不经宿主端口)
    location / {
        proxy_pass http://kwikquant-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket(/ws STOMP,长连接)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
