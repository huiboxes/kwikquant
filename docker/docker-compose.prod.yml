# 生产编排:postgres + app + frontend + edge。
# 网络隔离:postgres 在私有 kwikquant-data-net(仅 postgres+app),worker 跑不可信 Python 不直连 DB(资损级风险);
# app 双网卡(data-net 连 postgres + worker-net 给 worker 访问 app:8080);frontend/edge 只 worker-net。
# worker 不在此处长驻(DockerWorkerManager 按需 docker run --network kwikquant-worker-net 起策略 worker 容器,
# 复用 worker-net 访问 app:8080,不达 data-net 故不连 DB)。env_file 注入 secrets(JWT/ENCRYPTION/MCP_PEPPER/POSTGRES/SPRING_PROFILES_ACTIVE)。
# 关键变量经 ${VAR:?msg} 校验:--env-file 缺项时 compose 拒绝启动(fail-fast,不起半配置容器)。
services:
  postgres:
    image: postgres:16-alpine
    container_name: kwikquant-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [kwikquant-data-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: ${POSTGRES_LOG_MAX_SIZE:-10m}
        max-file: ${POSTGRES_LOG_MAX_FILES:-5}
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: kwikquant-app
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.0}
    pids_limit: 256
    env_file: ${ENV_FILE:-/opt/kwikquant/.env}
    environment:
      # 覆盖 env_file 的 dev 默认;prod 走容器网络名
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: kwikquant-postgres
      # secrets 经 env_file 注入容器;此处 :? 校验 --env-file 缺项即拒绝启动(fail-fast)
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      KWIKQUANT_MCP_PEPPER: ${KWIKQUANT_MCP_PEPPER:?KWIKQUANT_MCP_PEPPER is required}
      # worker 镜像随 tag 精确化(deploy 脚本 export KWIKQUANT_WORKER_IMAGE=...:$TAG);未设兜底 latest
      KWIKQUANT_WORKER_IMAGE: ${KWIKQUANT_WORKER_IMAGE:-ghcr.io/huiboxes/kwikquant-worker:latest}
      # 单节点不变量(Wave 1.5-c):app_lease 表拒绝第二实例启动(共享 DB 时跨 host 多实例被拒)。
      # node-id 缺省 fallback 随机 UUID;k8s 部署可设 KWIKQUANT_LEASE_NODE_ID=$POD_NAME 稳定标识。
    depends_on:
      postgres: { condition: service_healthy }
    # 双网卡:data-net 连 postgres(DB),worker-net 给 worker 容器访问 app:8080;worker 不在 data-net 不达 DB
    networks: [kwikquant-data-net, kwikquant-worker-net]
    # DockerWorkerManager(app 容器内)用 docker CLI + 宿主 socket 起 worker 容器(DooD 模式)
    # group_add DOCKER_GID:kwik(1000) 加宿主 docker 组能读 socket;deploy 脚本自动 getent group docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    # 8080 只绑宿主 localhost:deploy 脚本 readiness curl + 本地调试;不对公网暴露,经 frontend 容器反代
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: ${APP_LOG_MAX_SIZE:-10m}
        max-file: ${APP_LOG_MAX_FILES:-5}
  frontend:
    image: ${APP_FRONTEND_IMAGE:-ghcr.io/huiboxes/kwikquant-frontend:latest}
    container_name: kwikquant-frontend
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    networks: [kwikquant-worker-net]
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    pids_limit: 128
    # 安全默认仅供宿主反代访问。容器化面板应加入 worker-net；不得用 0.0.0.0 暴露明文登录入口。
    ports: ["127.0.0.1:8081:80"]
  edge:
    # 无面板用户可选:CF Origin Certificate 在此终结 TLS :443 → frontend 容器(同 worker-net 容器名)
    # 有面板用户(宝塔/1Panel)不起 edge,用面板 nginx 做 TLS + 反代 frontend:8081(见 docs/deploy.md 5.6 节)
    image: nginx:1.27-alpine
    container_name: kwikquant-edge
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      frontend: { condition: service_started }
    networks: [kwikquant-worker-net]
    ports: ["443:443"]
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-/etc/letsencrypt/live/kwikquant.example.com}:/cert:ro
networks:
  kwikquant-worker-net:
    name: kwikquant-worker-net
    driver: bridge
  kwikquant-data-net:
    name: kwikquant-data-net
    driver: bridge
volumes:
  postgres_data:
